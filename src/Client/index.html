<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Self Drive Car in Goa | 24 X 7 Mopa and Dabolim</title>
    <meta
      name="description"
      content="Self drive car, bike and scooter rentals in Goa, 24 x 7. Pick up at Mopa and Dabolim airports, railway stations and beach towns, or get it delivered. Fixed prices, verified local partners."
    />
    <link rel="canonical" href="https://gogoarental.in/" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preload" as="image" type="image/webp" href="/logo.webp" />
    <meta name="theme-color" content="#0b4ea2" />

    <!-- Link previews (WhatsApp, Facebook, X). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GoGoa Rentals" />
    <meta property="og:title" content="Best Self Drive Car in Goa | 24 X 7 Mopa and Dabolim" />
    <meta
      property="og:description"
      content="Self drive cars, bikes and scooters in Goa, 24 x 7. Pick up at Mopa and Dabolim airports or get it delivered."
    />
    <meta property="og:url" content="https://gogoarental.in/" />
    <meta property="og:image" content="https://gogoarental.in/logo.webp" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary" />

    <!--
      Structured data. WebSite.name is what Google shows as the site name above the link (instead of the bare
      domain); AutoRental lets Google show the business with its phone number and service area.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://gogoarental.in/#website",
            "name": "GoGoa Rentals",
            "alternateName": ["GoGoa Rental", "GoGoaRentals", "gogoarental.in"],
            "url": "https://gogoarental.in/"
          },
          {
            "@type": "AutoRental",
            "@id": "https://gogoarental.in/#business",
            "name": "GoGoa Rentals",
            "description": "Self drive car, bike and scooter rentals in Goa with pickup at Mopa and Dabolim airports, 24 x 7.",
            "url": "https://gogoarental.in/",
            "logo": "https://gogoarental.in/icon-192.png",
            "image": "https://gogoarental.in/logo.webp",
            "telephone": "+91-7709788010",
            "priceRange": "₹500 - ₹2000 per day",
            "openingHours": "Mo-Su 00:00-23:59",
            "address": { "@type": "PostalAddress", "addressRegion": "Goa", "addressCountry": "IN" },
            "areaServed": { "@type": "State", "name": "Goa" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
